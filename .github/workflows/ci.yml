name: CI

# The same checks as `npm run check`, on every push and pull request. The
# database, mail-server and reply tests run against throwaway services here.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      mail:
        image: greenmail/standalone:2.1.2
        env:
          GREENMAIL_OPTS: >-
            -Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0
            -Dgreenmail.auth.disabled=false
            -Dgreenmail.users=support:ci-mail-pass@shailmanntech.test
        ports: ["3993:3993", "3025:3025"]

    env:
      TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/ci
      TEST_IMAP_HOST: localhost
      TEST_IMAP_PORT: "3993"
      TEST_SMTP_PORT: "3025"
      TEST_IMAP_USER: support
      TEST_IMAP_PASSWORD: ci-mail-pass
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint -- --max-warnings=0
      - name: Type check
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Production build
        run: npm run build
